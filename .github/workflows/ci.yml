name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows-static
            generator_platform: x64
          - os: windows-latest
            triplet: x86-windows-static
            generator_platform: Win32
          - os: macos-latest
            triplet: x64-osx

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev libpng-dev zlib1g-dev cmake build-essential

    - name: Install dependencies on macOS
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install libjpeg libpng zlib cmake

    - name: Install dependencies on Windows
      if: runner.os == 'Windows'
      run: |
        # Windows runners usually have these libraries pre-installed
        # If needed, install additional dependencies here

    - name: Cache vcpkg packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/packages
          vcpkg/archives
          vcpkg/downloads
          vcpkg/installed
        key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-

    - name: Install vcpkg on Windows
      if: runner.os == 'Windows'
      shell: powershell
      env:
        VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg.exe install libjpeg-turbo:${{ matrix.triplet }} libpng:${{ matrix.triplet }} zlib:${{ matrix.triplet }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Use generator platform when provided (e.g., Win32 for x86)
        if ($env:GENERATOR_PLATFORM -and $env:GENERATOR_PLATFORM -ne '') {
          $arch = $env:GENERATOR_PLATFORM
        } else {
          # matrix.generator_platform is expanded by Actions runner; assign as literal string
          $arch = '${{ matrix.generator_platform }}'
        }
        Write-Host "Using generator platform: $arch"
        # Build a forward-slash vcpkg toolchain path to avoid PowerShell escaping/backslash issues
        $vcpkgToolchain = "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        Write-Host "Using vcpkg toolchain: $vcpkgToolchain"
        cmake -S . -B build -A $arch -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

    - name: Configure & build (non-Windows) - static
      if: runner.os != 'Windows'
      run: |
        cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DENABLE_STATIC_LIB=ON -DENABLE_SHARED_LIB=OFF
        cmake --build build-static --config Release -- -j
        ctest --test-dir build-static --output-on-failure --build-config Release || true

    - name: Configure & build (non-Windows) - shared
      if: runner.os != 'Windows'
      run: |
        cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DENABLE_STATIC_LIB=OFF -DENABLE_SHARED_LIB=ON
        cmake --build build-shared --config Release -- -j
        ctest --test-dir build-shared --output-on-failure --build-config Release || true

    - name: Build & test (Windows) - static
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Write-Host "Building static (generator platform: $env:GENERATOR_PLATFORM)"
        $vcpkgToolchain = "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        cmake -S . -B build-static -A $arch -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DENABLE_STATIC_LIB=ON -DENABLE_SHARED_LIB=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        cmake --build build-static --config Release
        ctest --test-dir build-static --output-on-failure --build-config Release || true

    - name: Build & test (Windows) - shared
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Write-Host "Building shared (generator platform: $arch)"
        $vcpkgToolchain = "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        cmake -S . -B build-shared -A $arch -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DENABLE_STATIC_LIB=OFF -DENABLE_SHARED_LIB=ON -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        cmake --build build-shared --config Release
        ctest --test-dir build-shared --output-on-failure --build-config Release || true
