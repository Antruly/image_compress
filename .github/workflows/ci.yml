name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows-static
            generator_platform: x64
          - os: windows-latest
            triplet: x86-windows-static
            generator_platform: Win32
          - os: macos-latest
            triplet: x64-osx

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev libpng-dev zlib1g-dev cmake build-essential

    - name: Install dependencies on macOS
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install libjpeg libpng zlib cmake

    - name: Install dependencies on Windows
      if: runner.os == 'Windows'
      run: |
        # Windows runners usually have these libraries pre-installed
        # If needed, install additional dependencies here

    - name: Install vcpkg on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg.exe install libjpeg-turbo:${{ matrix.triplet }} libpng:${{ matrix.triplet }} zlib:${{ matrix.triplet }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Use generator platform when provided (e.g., Win32 for x86)
        if ($env:GENERATOR_PLATFORM) {
          $arch = $env:GENERATOR_PLATFORM
        } else {
          $arch = \"${{ matrix.generator_platform }}\"
        }
        cmake -S . -B build -A $arch -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

    - name: Configure CMake (non-Windows)
      if: runner.os != 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config Release
