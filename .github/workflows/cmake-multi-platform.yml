name: CMake Multi-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libpng-dev libjpeg-dev zlib1g-dev cmake build-essential

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libpng libjpeg zlib cmake

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-vcpkg@v1
      with:
        vcpkg-version: '2024.12.16'
        vcpkg-triplet: x64-windows-static

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTS=ON

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.config }}

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config ${{ matrix.config }}